<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14231d"><title>بوابة التشغيل | Alazhar City</title><link rel="icon" type="image/png" href="icons/favicon-64.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--ink:#14231d;--red:#e94b3c;--green:#0a8150;--bg:#f4f7f5;--line:#e3e9e5;--muted:#69736e}*{box-sizing:border-box}body{margin:0;font-family:Cairo,system-ui;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.shell{max-width:1200px;margin:auto;padding:22px 16px}.head{background:var(--ink);color:#fff;border-radius:24px;padding:20px 22px;display:flex;align-items:center;gap:14px}.head img{width:52px;height:52px;border-radius:15px}.head h1{font-size:1.2rem;margin:0}.head p{margin:2px 0 0;font-size:.78rem;opacity:.7}.back{margin-inline-start:auto;color:#fff;text-decoration:none;border:1px solid #ffffff55;border-radius:12px;padding:8px 12px;font-size:.8rem}.roles{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.roles button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px 15px;font-weight:800;color:var(--ink)}.roles button.active{background:var(--red);border-color:var(--red);color:#fff}.note{padding:12px 14px;border-right:4px solid var(--green);background:#e8f7ef;border-radius:12px;font-size:.82rem;line-height:1.7}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}.metric small{color:var(--muted);font-weight:700}.metric b{display:block;font-size:1.7rem;margin-top:5px}.panel{margin-top:14px}.panel h2{margin:0 0 12px;font-size:1rem}.table{width:100%;border-collapse:collapse;font-size:.82rem}.table th,.table td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:right}.table th{color:var(--muted);font-size:.73rem}.tag{font-size:.7rem;font-weight:800;border-radius:99px;padding:4px 8px;background:#fff0ed;color:#bd3027;white-space:nowrap}.tag.preparing,.tag.ready{background:#fff7dc;color:#926300}.tag.delivering,.tag.delivered{background:#e5f6ee;color:#087345}.action{border:0;border-radius:9px;background:var(--ink);color:#fff;padding:6px 9px;font-size:.72rem;font-weight:800;cursor:pointer}.action.red{background:var(--red)}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{margin:0;padding:0;list-style:none}.list li{padding:11px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.list small{display:block;color:var(--muted)}.empty{text-align:center;color:var(--muted);padding:28px}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.table th:nth-child(3),.table td:nth-child(3){display:none}.head{padding:16px}.back{font-size:.7rem}}
</style></head><body><main class="shell"><header class="head"><img src="images/logo.webp" alt="Alazhar City"><div><h1>بوابة تشغيل Alazhar City</h1><p>إدارة الطلبات والشركاء والمندوبين — الحي السادس</p></div><button class="back" id="loginBtn" type="button">تسجيل الدخول</button><a class="back" href="./index.html">رجوع للمتجر</a></header><nav class="roles" aria-label="اختر الواجهة"><button class="active" data-role="admin">الإدارة</button><button data-role="merchant">صاحب المتجر</button><button data-role="rider">المندوب</button><button data-role="customer">العميل</button></nav><div class="note" id="modeNote"></div><section id="app"></section></main><script src="./platform-store.js"></script><script type="module" src="./firebase-client.js"></script><script src="./portal.js"></script></body></html>
